name: Päivitä ja julkaise otteluopas

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Palauta ohjelmaoppaiden välimuisti
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: schedules-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: schedules-
      - run: npm run build
      - name: Säilytä lähteet seuraavaa päivitystä varten
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: schedules-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Julkaise GitHub Pagesiin
        id: deployment
        uses: actions/deploy-pages@v4
